{% set name = "jnv" %}
{% set version = "0.6.2" %}

package:
  name: {{ name | lower }}
  version: {{ version }}

source:
  url: https://github.com/ynqa/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 767226c67378381d1e71ffe0e631a5b5ffc00e957a05780a9b23b6a65023bb44

build:
  number: 0

requirements:
  build:
    - {{ compiler('rust') }}
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - cargo-bundle-licenses

test:
  commands:
    - jnv --version

about:
  home: https://github.com/ynqa/jnv
  license: MIT
  license_family: MIT
  license_file:
    - LICENSE
    - THIRDPARTY_LICENSES.yaml
  summary: JSON navigator and interactive filter leveraging jq

extra:
  recipe-maintainers:
    - pavelzw
    - moritzwilksch
